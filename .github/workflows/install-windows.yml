name: Install on Windows (the student's path)

# Runs the published installer on a clean Windows, exactly as the README tells a student to:
# `irm .../scripts/install.ps1 | iex`, then `pastor version` from a new shell.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    steps:
      - name: Install with the README one-liner
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/Ad3Digital/pastor/main/scripts/install.ps1 | iex
      - name: pastor runs from a new shell
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          pastor version
          pastor --help | Select-Object -First 3
